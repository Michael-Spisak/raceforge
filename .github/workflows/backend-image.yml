name: Backend image

# Spec 0006: publish the backend API image to ghcr.io for `raceforge-admin update <version>`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3  # the Proxmox VM is x86-64; arm64 for Apple-silicon tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/michael-spisak/raceforge-backend:${{ github.ref_name }}
            ghcr.io/michael-spisak/raceforge-backend:latest
