name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: sh scripts/check.sh

  ldraw-integration:
    # Spec 0002 AC9: regenerate catalogue bounding boxes from the real LDraw library and
    # fail if the committed bboxes.yaml is out of date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/raceforge/ldraw
          key: ldraw-complete-v1
      - run: uv sync --locked
      - name: Fetch LDraw library (cached)
        run: test -d ~/.cache/raceforge/ldraw/parts || PYTHONPATH=src uv run raceforge parts fetch
      - name: Bounding boxes up to date
        run: |
          PYTHONPATH=src uv run raceforge parts build-catalogue
          git diff --exit-code src/raceforge/parts/data/bboxes.yaml
