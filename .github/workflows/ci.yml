name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # nightly: slow acceptance runs, cargo-deny advisories; Sundays: long fuzzing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: sh scripts/check.sh

  rust:
    # Spec 0005 AC1/AC3/AC4/AC6/AC9: car runtime crates (fmt, clippy -D warnings, tests, cargo-deny,
    # aarch64 release build).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # RF_PYTHON enables the end-to-end tests against the Python controller host (AC3/AC4).
      - run: RF_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test --locked
      # AC9 / ADR-0020: licences, advisories, bans and sources for the runtime and the fuzz crate.
      - uses: actions/cache@v4
        id: cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ env.ImageOS }}
      - if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check
      - run: cargo deny --manifest-path fuzz/Cargo.toml check
      # AC9 / ADR-0021: static aarch64 binary for the board (linker set in .cargo/config.toml).
      # setup-board.sh --binary installs it (and restores the executable bit).
      - run: cargo build --locked --release --target aarch64-unknown-linux-musl -p rf-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: rf-runtime-aarch64
          path: car_runtime/target/aarch64-unknown-linux-musl/release/rf-runtime
          retention-days: 14
          if-no-files-found: error

  rust-arm64:
    # ADR-0021: the target that ships (aarch64 musl), tested natively on an ARM core; emulation
    # breaks the timing tests. Python runtime deps only, for the controller host in the
    # end-to-end tests (some dev tools have no aarch64 wheels).
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: car_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
        working-directory: .
      - name: rustup (if the runner image has none)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: rustup component add clippy
      - run: cargo clippy --locked --all-targets --target aarch64-unknown-linux-musl -- -D warnings
      - run: RF_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test --locked --target aarch64-unknown-linux-musl

  fuzz:
    # Spec 0005 AC1 / ADR-0019: coverage-guided fuzzing of the EV3 and LD06 parsers on a pinned
    # nightly. 60 s per target; 30 min per target in the Sunday scheduled run.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: car_runtime
    env:
      FUZZ_NIGHTLY: nightly-2026-09-24
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - name: Fuzz crate (fmt, clippy, lockfile) on the pinned stable toolchain
        working-directory: car_runtime/fuzz
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - uses: actions/cache@v4
        id: cargo-fuzz
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ env.ImageOS }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz@0.13.2
      # Corpus carried between runs (generated data, never committed).
      - uses: actions/cache@v4
        with:
          path: car_runtime/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target
        run: |
          seconds=60
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 7 ]; then seconds=1800; fi
          for target in $(cargo +"$FUZZ_NIGHTLY" fuzz list); do
            echo "::group::$target ($seconds s)"
            cargo +"$FUZZ_NIGHTLY" fuzz run "$target" -- -max_total_time="$seconds"
            echo "::endgroup::"
          done
      # A crash: the failing input is in fuzz/artifacts/<target>/. Fix it with a unit test that
      # reproduces it (ADR-0019).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: car_runtime/fuzz/artifacts
          if-no-files-found: ignore

  frontend:
    # Spec 0008: lint, types, unit tests, build, Playwright e2e against the real engine, Electron smoke.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - name: API types are up to date with the OpenAPI snapshot
        working-directory: frontend
        run: npm run gen:api:file && git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Electron smoke test
        working-directory: frontend
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx electron . --smoke --no-sandbox; else npx electron . --smoke; fi

  ldraw-integration:
    # Spec 0002 AC9: regenerate catalogue bounding boxes from the real LDraw library and
    # fail if the committed bboxes.yaml is out of date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/raceforge/ldraw
          key: ldraw-complete-v1
      - run: uv sync --locked
      - name: Fetch LDraw library (cached)
        id: fetch
        run: |
          if [ -d ~/.cache/raceforge/ldraw/parts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p ~/.cache/raceforge
          if curl -fsSL -A "RaceForge-CI (+https://github.com/Michael-Spisak/raceforge)" \
               -o ~/.cache/raceforge/ldraw-complete.zip https://library.ldraw.org/library/updates/complete.zip; then
            unzip -q ~/.cache/raceforge/ldraw-complete.zip -d ~/.cache/raceforge && echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::library.ldraw.org refused the download from this runner; bounding-box check skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bounding boxes up to date
        if: steps.fetch.outputs.ok == 'true'
        run: |
          PYTHONPATH=src uv run raceforge parts build-catalogue
          git diff --exit-code src/raceforge/parts/data/bboxes.yaml

  slow-acceptance:
    # Spec 0004 AC2: templates complete 3 laps on 20 generated corridors.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: PYTHONPATH=src uv run pytest -m slow -p no:cacheprovider --no-cov -q
