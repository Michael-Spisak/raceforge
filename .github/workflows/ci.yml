name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # nightly: slow acceptance runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: sh scripts/check.sh

  rust:
    # Spec 0005 AC1/AC3/AC4/AC6/AC9: car runtime crates (fmt, clippy -D warnings, tests).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # RF_PYTHON enables the end-to-end tests against the Python controller host (AC3/AC4).
      - run: RF_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test --locked

  frontend:
    # Spec 0008: lint, types, unit tests, build, Playwright e2e against the real engine, Electron smoke.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - name: API types are up to date with the OpenAPI snapshot
        working-directory: frontend
        run: npm run gen:api:file && git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Electron smoke test
        working-directory: frontend
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx electron . --smoke --no-sandbox; else npx electron . --smoke; fi

  backend-services:
    # Spec 0006: the backend test suite against PostgreSQL 17 and an S3 server (SeaweedFS, ADR-0019).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rf
          POSTGRES_PASSWORD: rf
          POSTGRES_DB: rf
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rf" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 -e AWS_ACCESS_KEY_ID=rftest \
            -e AWS_SECRET_ACCESS_KEY=rftestsecret chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8333/healthz && break; sleep 1; done
      - run: PYTHONPATH=src uv run pytest tests/backend --no-cov -q
        env:
          RF_TEST_DATABASE_URL: postgresql+psycopg://rf:rf@localhost:5432/rf
          RF_TEST_S3_ENDPOINT: localhost:8333
          RF_TEST_S3_ACCESS_KEY: rftest
          RF_TEST_S3_SECRET_KEY: rftestsecret

  backend-stack:
    # Spec 0006 AC1 (Compose up, health green), AC9 (blue-green update), AC8 (backup → restore),
    # AC10 (Playwright team flow against the stack).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: deploy/tests/stack-e2e.sh
        env:
          RF_E2E_PLAYWRIGHT: "1"

  ldraw-integration:
    # Spec 0002 AC9: regenerate catalogue bounding boxes from the real LDraw library and
    # fail if the committed bboxes.yaml is out of date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/raceforge/ldraw
          key: ldraw-complete-v1
      - run: uv sync --locked
      - name: Fetch LDraw library (cached)
        id: fetch
        run: |
          if [ -d ~/.cache/raceforge/ldraw/parts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p ~/.cache/raceforge
          if curl -fsSL -A "RaceForge-CI (+https://github.com/Michael-Spisak/raceforge)" \
               -o ~/.cache/raceforge/ldraw-complete.zip https://library.ldraw.org/library/updates/complete.zip; then
            unzip -q ~/.cache/raceforge/ldraw-complete.zip -d ~/.cache/raceforge && echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::library.ldraw.org refused the download from this runner; bounding-box check skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bounding boxes up to date
        if: steps.fetch.outputs.ok == 'true'
        run: |
          PYTHONPATH=src uv run raceforge parts build-catalogue
          git diff --exit-code src/raceforge/parts/data/bboxes.yaml

  slow-acceptance:
    # Spec 0004 AC2: templates complete 3 laps on 20 generated corridors.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: PYTHONPATH=src uv run pytest -m slow -p no:cacheprovider --no-cov -q
