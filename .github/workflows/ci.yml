name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # nightly: slow acceptance runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: sh scripts/check.sh

  frontend:
    # Spec 0008: lint, types, unit tests, build, Playwright e2e against the real engine, Electron smoke.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - name: API types are up to date with the OpenAPI snapshot
        working-directory: frontend
        run: npm run gen:api:file && git diff --exit-code src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Electron smoke test
        working-directory: frontend
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx electron . --smoke --no-sandbox; else npx electron . --smoke; fi

  ldraw-integration:
    # Spec 0002 AC9: regenerate catalogue bounding boxes from the real LDraw library and
    # fail if the committed bboxes.yaml is out of date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/raceforge/ldraw
          key: ldraw-complete-v1
      - run: uv sync --locked
      - name: Fetch LDraw library (cached)
        id: fetch
        run: |
          if [ -d ~/.cache/raceforge/ldraw/parts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p ~/.cache/raceforge
          if curl -fsSL -A "RaceForge-CI (+https://github.com/Michael-Spisak/raceforge)" \
               -o ~/.cache/raceforge/ldraw-complete.zip https://library.ldraw.org/library/updates/complete.zip; then
            unzip -q ~/.cache/raceforge/ldraw-complete.zip -d ~/.cache/raceforge && echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::library.ldraw.org refused the download from this runner; bounding-box check skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bounding boxes up to date
        if: steps.fetch.outputs.ok == 'true'
        run: |
          PYTHONPATH=src uv run raceforge parts build-catalogue
          git diff --exit-code src/raceforge/parts/data/bboxes.yaml

  slow-acceptance:
    # Spec 0004 AC2: templates complete 3 laps on 20 generated corridors.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: PYTHONPATH=src uv run pytest -m slow -p no:cacheprovider --no-cov -q
