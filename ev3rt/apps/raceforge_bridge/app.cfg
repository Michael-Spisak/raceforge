INCLUDE("app_common.cfg");

#include "app.h"

DOMAIN(TDOM_APP) {
CRE_TSK(MAIN_TASK, { TA_ACT, 0, main_task, PRIORITY_MAIN_TASK, STACK_SIZE, NULL });
/* 100 Hz control cycle: failsafe, motors, sensors, reply frame */
CRE_TSK(CTRL_TASK, { TA_NULL, 0, control_task, PRIORITY_CTRL_TASK, STACK_SIZE, NULL });
EV3_CRE_CYC(CYC_CTRL, { TA_NULL, CTRL_TASK, task_activator, RF_CONTROL_PERIOD_MS, 0 });
/* serial receiver: bytes -> COBS packets -> commands */
CRE_TSK(RX_TASK, { TA_NULL, 0, rx_task, PRIORITY_RX_TASK, STACK_SIZE, NULL });
CRE_MTX(MTX_BRIDGE, { TA_TPRI });
}

ATT_MOD("app.o");
ATT_MOD("rf_proto.o");
ATT_MOD("rf_bridge.o");
