[project]
name = "raceforge"
version = "0.0.1"
description = "Construction, simulation and training tool for an autonomous LEGO race car"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "mcap>=1.2",
    "mujoco>=3.2",
    "numpy>=2.0",
    "pydantic>=2.11",
    "pyyaml>=6",
]

[project.scripts]
raceforge = "raceforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "hypothesis>=6.100",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raceforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "ev3_side"]
extraPaths = ["src", "ev3_side"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/raceforge/core", "src/raceforge/api", "src/raceforge/control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Python ≥3.13 on macOS skips .pth files with the "hidden" flag (uv venvs may set it), so put src on the path explicitly.
pythonpath = ["src", "ev3_side"]
addopts = "--cov=raceforge --cov-report=term-missing -m 'not slow'"
markers = ["slow: long-running acceptance runs (nightly CI job; run with -m slow)"]

[tool.importlinter]
root_package = "raceforge"

[[tool.importlinter.contracts]]
name = "control is independent of sim, train and front-ends"
type = "forbidden"
source_modules = ["raceforge.control"]
forbidden_modules = ["raceforge.sim", "raceforge.train", "raceforge.cli", "raceforge.mcp", "raceforge.backend"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core depends on nothing else in raceforge"
type = "forbidden"
source_modules = ["raceforge.core"]
forbidden_modules = ["raceforge.control", "raceforge.sim", "raceforge.train", "raceforge.api", "raceforge.cli", "raceforge.mcp", "raceforge.backend"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "car host runs controllers only: no sim, train or front-ends"
type = "forbidden"
source_modules = ["raceforge.car"]
forbidden_modules = ["raceforge.sim", "raceforge.train", "raceforge.construct", "raceforge.cli", "raceforge.mcp", "raceforge.backend"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "construct and parts do not depend on sim, train or front-ends"
type = "forbidden"
source_modules = ["raceforge.construct", "raceforge.parts"]
forbidden_modules = ["raceforge.sim", "raceforge.train", "raceforge.cli", "raceforge.mcp", "raceforge.backend"]
allow_indirect_imports = true
