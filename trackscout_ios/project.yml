# TrackScout Xcode project (spec 0007, ADR-0020). Generate with: xcodegen generate
# Signing: copy Config/Local.xcconfig.template to Config/Local.xcconfig (git-ignored) and fill in your
# free Apple ID team and a unique bundle-id prefix.
name: TrackScout
options:
  bundleIdPrefix: org.raceforge
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  TrackScoutKit:
    path: TrackScoutKit
targets:
  TrackScout:
    type: application
    platform: iOS
    sources:
      - path: TrackScout
    dependencies:
      - package: TrackScoutKit
    scheme: {}  # shared scheme, so `xcodebuild -scheme TrackScout` and Xcode's Run work on a fresh checkout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RF_BUNDLE_PREFIX).trackscout
        DEVELOPMENT_TEAM: $(RF_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TrackScout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "TrackScout records the corridor with the camera and LiDAR."
        INFOPLIST_KEY_NSMotionUsageDescription: "TrackScout records gravity and motion to align the scan."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "TrackScout uploads recordings to your team's RaceForge server, which can be a computer in your Wi-Fi."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "TrackScout can send recordings to your laptop over Bluetooth."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
