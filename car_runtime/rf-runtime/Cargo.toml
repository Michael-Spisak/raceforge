[package]
name = "rf-runtime"
description = "RaceForge car runtime binary: runs a deploy bundle on the car (spec 0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rf-runtime"
path = "src/main.rs"

[dependencies]
rf-core = { path = "../rf-core" }
rf-ev3 = { path = "../rf-ev3" }
rf-log = { path = "../rf-log" }
rf-proto = { path = "../rf-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
