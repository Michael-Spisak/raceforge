# cargo-deny for the car runtime and its fuzz crate (spec 0005 AC9, ADR-0020).
#   cargo deny check                                  # runtime workspace
#   cargo deny --manifest-path fuzz/Cargo.toml check  # fuzz crate (same rules)

[graph]
all-features = true

[licenses]
# GPL-3.0-compatible licences. A licence outside this list needs an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0", # unicode-ident
    "NCSA",        # libFuzzer, fuzz crate only
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# Our own crates (GPL-3.0-or-later, publish = false).
[licenses.private]
ignore = true

[advisories]
# Vulnerabilities and unmaintained crates fail by default. An advisory without a fix that does
# not affect us goes here with its ID, a reason and a review date:
# ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "... (review YYYY-MM-DD)" }]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
