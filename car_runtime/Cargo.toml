[workspace]
resolver = "2"
members = ["rf-proto", "rf-core", "rf-ev3", "rf-lidar", "rf-log", "rf-runtime", "rf-telemetry"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Michael-Spisak/raceforge"
# Nothing is published to crates.io; cargo-deny skips private crates in the licence check (ADR-0026).
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
